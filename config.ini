[webserverserver]
port=8080
compression=1
max_payload_length=2048
reset_idle_timeout_on_send=true
idle_timeout=180
max_backpressure=65536
log_folder=logs
max_messages_per_second=500
message_queue_length=250000


[ssl]
enabled=false
key_filename=certs/key.pem
cert_filename=certs/cert.pem
passphrase=123456

[game]
scripts_folder=scripts
log_folder=logs
listing_interval=1000
max_reconnection_time=360000

[games]
hangman_relay=relay
hangman=hangman
tictactoe=tictactoe
my_test_tictactoe=tictactoe

[database]
enabled=false
username=<username>
password=<password>
host=<host>
port=<port>
database=<database>
sslmode=<sslmode>

[authentication]
enabled=false
