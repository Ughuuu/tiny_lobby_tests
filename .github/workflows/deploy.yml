name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build Docker Image (Linux)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: registry.digitalocean.com
      REGISTRY_PATH: blazium-registry
      DOCKER_NAME: lobby_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: lobby_server-linux-x64-release
          path: build/      

      - name: List contents of build directory
        run: ls -R build
        
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ env.DOCKER_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ env.DOCKER_NAME }}:${{ github.sha }}  
