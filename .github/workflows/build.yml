name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Build & Install dependencies for Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./install-linux.sh
        ./build_release.sh

    - name: Build & Install dependencies for macOS
      if: matrix.os == 'macos-latest'
      run: |
        ./install-macos.sh
        ./build_release_macos.sh

    
    - name: Build & Install dependencies for Windows
      if: matrix.os == 'windows-latest'
      run: |
        ./install-windows.bat
        ./build_release.bat

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: |
          build/lobby_server*
        if-no-files-found: error
