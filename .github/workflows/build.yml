name: Build

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install clang-format clang-tidy

      - name: Check formatting in src directory
        run: ./check_format.sh

  build-linux:
    name: Build on Linux (${{ matrix.arch }} ${{ matrix.type }})
    needs: lint
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # arch: [x64, arm64]
        arch: [x64]
        type: [debug, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Cache vcpkg dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.arch }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.arch }}
            vcpkg-${{ runner.os }}-
      
      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies ${{ matrix.arch }}
        run: |
          sudo apt update
          sudo apt install -y software-properties-common autoconf 
          ./install-linux-${{ matrix.arch }}.sh

      - name: Build Release
        run: |
          ./build_${{ matrix.type }}-${{ matrix.arch }}.sh

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobby_server-linux-${{ matrix.arch }}-${{ matrix.type }}
          path: build/lobby_server
          if-no-files-found: error

  test:
    name: Test Code (Ubuntu)
    runs-on: ubuntu-22.04
    needs: build-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: lobby_server-linux-x64-release
          path: build
      
      - name: Clone Old Lobby Server
        uses: actions/checkout@v4
        with:
          repository: blazium-engine/blazium-lobby
          path: old-lobby
          token: ${{ secrets.GH_PAT }}
      
      # Set up Go environment
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21  # Specify the Go version you are using

      # Install dependencies
      - name: Install Dependencies
        working-directory: old-lobby
        run: go mod tidy

      # Run the app and tests in the same step
      - name: Run App and Tests
        working-directory: old-lobby
        run: |
          # Start the app in the background
          cd ..
          cp build/lobby_server .
          ls
          chmod +x lobby_server
          ./lobby_server &> app.log &
          sleep 10
          cd old-lobby
          go test -timeout 200s -tags=auth ./... -v
          go test -timeout 200s -tags=lobby ./... -v
        env:
          # For the concurrent test
          BLAZIUM_RATE_LIMIT: 1000
      
      # Always print server logs
      - name: Print Server Logs
        if: always()
        run: |
          cat app.log
          cat logs/game.txt
          cat logs/websocket.txt

  build-macos:
    name: Build on macOS (${{ matrix.arch }})
    if: false
    needs: lint
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Cache vcpkg dependencies
        uses: actions/restore@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}
            vcpkg-${{ runner.os }}-
      
      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies (macOS ${{ matrix.arch }})
        run: |
          ./install-macos-${{ matrix.arch }}.sh

      - name: Cache vcpkg dependencies
        uses: actions/save@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}
            vcpkg-${{ runner.os }}-
  
      - name: Build (macOS ${{ matrix.arch }})
        run: |
          ./build_release_macos-${{ matrix.arch }}.sh

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobby_server-macos-${{ matrix.arch }}
          path: build/lobby_server*
          if-no-files-found: error

  build-windows:
    name: Build on Windows (x64)
    if: false
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1.4.1
      
      - name: Cache vcpkg dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}
            vcpkg-${{ runner.os }}-

      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Install dependencies
        shell: pwsh
        run: |
          .\install-windows.ps1

      - name: Install pkg-config
        run: choco install pkgconfiglite

      - name: Set PKG_CONFIG_PATH
        run: |
          echo "PKG_CONFIG_PATH=C:\tools\pkgconfiglite" >> $env:GITHUB_ENV

      - name: Build Release
        shell: pwsh
        run: |
          # Comment this out so we have a passing build, for cache
          # .\build_release.ps1

      #- name: Archive build artifacts
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: lobby_server-windows-x64
      #    path: build/lobby_server*
      #    if-no-files-found: error
  
  docker-build:
    name: Build Docker Image (Linux)
    needs: [build-linux, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: lobby_server-linux-x64-release
          path: build/      

      - name: List contents of build directory
        run: ls -R build
        
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          tags: |
            lobby-service:latest
            lobby-service:${{ github.sha }}
