name: Build

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install clang-format clang-tidy

      - name: Check formatting in src directory
        run: ./check_format.sh

  build-linux:
    name: Build on Linux (Ubuntu ${{ matrix.arch }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # arch: [x64, arm64]
        arch: [x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies ${{ matrix.arch }}
        run: |
          sudo apt update
          sudo apt install -y software-properties-common autoconf 
          ./install-linux-${{ matrix.arch }}.sh

      - name: Build Release
        run: |
          ./build_release-${{ matrix.arch }}.sh

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobby_server-linux-${{ matrix.arch }}
          path: build/lobby_server
          if-no-files-found: error

  build-macos:
    name: Build on macOS (${{ matrix.arch }})
    needs: lint
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies (macOS ${{ matrix.arch }})
        run: |
          ./install-macos-${{ matrix.arch }}.sh

      - name: Build (macOS ${{ matrix.arch }})
        run: |
          ./build_release_macos-${{ matrix.arch }}.sh

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobby_server-macos-${{ matrix.arch }}
          path: build/lobby_server*
          if-no-files-found: error

  build-windows:
    name: Build on Windows (x64)
    if: false
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Create Public Key
        run: |
          echo "${{ secrets.GITHUB_PUBLIC_KEY }}" > public.key

      - name: Install dependencies
        shell: pwsh
        run: |
          .\install-windows.ps1

      - name: Install pkg-config
        run: choco install pkgconfiglite

      - name: Set PKG_CONFIG_PATH
        run: |
          echo "PKG_CONFIG_PATH=C:\tools\pkgconfiglite" >> $env:GITHUB_ENV

      - name: Build Release
        shell: pwsh
        run: |
          .\build_release.ps1

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobby_server-windows-x64
          path: build/lobby_server*
          if-no-files-found: error
  
  docker-build:
    name: Build Docker Image (Linux)
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: lobby_server-linux-x64
          path: build/      

      - name: List contents of build directory
        run: ls -R build
        
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          tags: |
            lobby-service:latest
            lobby-service:${{ github.sha }}
