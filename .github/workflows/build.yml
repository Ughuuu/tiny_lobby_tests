name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install clang-format clang-tidy

      - name: Check formatting in src directory
        run: ./bash/check_format.sh

      - name: Download luau-analyze
        run: |
          wget https://github.com/luau-lang/luau/releases/download/0.667/luau-ubuntu.zip
          unzip luau-ubuntu.zip
          chmod +x luau-analyze
          ./luau-analyze scripts/**/*.lua

  build-linux:
    name: Build on Linux (${{ matrix.arch }} ${{ matrix.type }})
    needs: lint
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        type: [release] #[debug, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Cache vcpkg dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.type }}

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies ${{ matrix.arch }}
        run: |
          sudo apt update
          sudo apt install -y software-properties-common autoconf 
          ./bash/install-linux-${{ matrix.arch }}.sh

      - name: Cache vcpkg dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.type }}

      - name: Build Release
        run: |
          export OPENSSL_ROOT_DIR=./external/vcpkg/installed/x64-linux
          export PKG_CONFIG_PATH=./external/vcpkg/installed/x64-linux/lib/pkgconfig
          ./bash/build_${{ matrix.type }}-${{ matrix.arch }}.sh

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiny_lobby-linux-${{ matrix.arch }}-${{ matrix.type }}
          path: build/tiny_lobby
          if-no-files-found: error

  docker-build:
    name: Build Docker Image (Linux)
    needs: build-linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x64
            docker_arch: amd64
          - arch: arm64
            docker_arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-linux-${{ matrix.arch }}-release
          path: build/

      - name: List contents of build directory
        run: ls -R build
        
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.docker_arch }}
          tags: |
            ghcr.io/${{ github.repository }}:latest

  build-macos:
    name: Build on macOS (${{ matrix.arch }})
    needs: lint
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Cache vcpkg dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}

      - name: Print versions
        run: |
          cmake --version
          clang --version

      - name: Install dependencies (macOS)
        run: |
          ./bash/install-macos-${{ matrix.arch }}.sh

      - name: Cache vcpkg dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}
  
      - name: Build (macOS)
        run: |
          ./bash/build_release_macos-${{ matrix.arch }}.sh


      # https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Install the Apple certificate and provisioning profile for macOS
        shell: bash
        env:
          # Developer ID Certificate
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          SIGNING_IDENTITY=$(security find-identity -p codesigning -v | awk -F'"' 'NR==1 {print $2}')
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Sign for macos
        shell: bash
        working-directory: build
        run: |

          # Set permissions and sign the application
          chmod +x tiny_lobby
          
          codesign --deep --force --options=runtime --verbose --timestamp \
            --entitlements ../signing/mac/entitlements.plist --sign "${{ env.APPLE_SIGNING_IDENTITY }}" \
            tiny_lobby
          codesign --verify --strict --deep --verbose tiny_lobby
          # Package the application into a zip file
          ditto -c -k --keepParent tiny_lobby tiny_lobby.zip

          /Applications/Xcode.app/Contents/Developer/usr/bin/notarytool store-credentials "AppleID" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}"

          /Applications/Xcode.app/Contents/Developer/usr/bin/notarytool submit tiny_lobby.zip --wait --keychain-profile "AppleID"

          rm tiny_lobby.zip

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiny_lobby-macos-${{ matrix.arch }}
          path: build/tiny_lobby*
          if-no-files-found: error

  build-windows:
    name: Build on Windows (x64)
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1.4.1
      
      - name: Cache vcpkg dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}

      - name: Install dependencies
        shell: pwsh
        run: |
          .\bash\install.ps1

      - name: Cache vcpkg dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
          key: vcpkg-${{ runner.os }}

      - name: Build Release
        shell: pwsh
        run: |
          .\bash\build_release.ps1

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiny_lobby-windows-x64
          path: |
            build/Release/tiny_lobby.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-linux-arm64-release
          path: tiny_lobby-linux-arm64-release

      - uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-linux-x64-release
          path: tiny_lobby-linux-x64-release

      - uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-macos-arm64
          path: tiny_lobby-macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-macos-x64
          path: tiny_lobby-macos-x64

      - uses: actions/download-artifact@v4
        with:
          name: tiny_lobby-windows-x64
          path: tiny_lobby-windows-x64

      # Rename executables
      - name: Rename executables
        run: |
          mkdir release
          mv tiny_lobby-linux-arm64-release/tiny_lobby release/tiny_lobby_linux_arm64
          mv tiny_lobby-linux-x64-release/tiny_lobby release/tiny_lobby_linux_x64
          mv tiny_lobby-macos-arm64/tiny_lobby release/tiny_lobby_macos_arm64
          mv tiny_lobby-macos-x64/tiny_lobby release/tiny_lobby_macos_x64
          mv tiny_lobby-windows-x64/tiny_lobby.exe release/tiny_lobby_windows_x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          release_name: Tiny Lobby v
          files: |
            release/tiny_lobby_linux_arm64
            release/tiny_lobby_linux_x64
            release/tiny_lobby_macos_arm64
            release/tiny_lobby_macos_x64
            release/tiny_lobby_windows_x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
